name: Fetch logos
on:
  push:
    branches: [old-site-archive]
    paths: [.github/workflows/fetch-logos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fetched; cd fetched
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get(){ curl -sSL -A "$UA" -m 30 -o "$1" -w "$1 %{http_code} %{content_type} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          get yloway.html https://yloway.com/
          get yellow.svg https://yloway.com/logo/logo-yellow.svg
          get yellow-onblack.svg https://yloway.com/logo/logo-onblack.svg
          get dohabank.png https://www.dohabank.com.qa/wp-content/uploads/sites/12/Doha-Bank-Logo.png
          get aamal.png https://www.aamal.com.qa/sites/aamal/files/aamal/logo/aamal-logo-header-updated.png
          get berkeley.png https://berkeleyqa.com/wp-content/uploads/2022/12/berkerley-web-logo.png
          get prime.png https://www.primesolutionconsulting.com/images/logo.png
          get profit.png https://profitholding.com.qa/wp-content/uploads/2020/01/logo.png
          grep -oiE '(src|href|content)="[^"]*(logo|Logo)[^"]*\.(png|svg|webp|jpg)[^"]*"' yloway.html | sort -u | head -20 > yloway-logos.txt || true
          file * > FILES.txt; cat FILES.txt yloway-logos.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add fetched && git commit -m "Fetch company logos" && git push || true
