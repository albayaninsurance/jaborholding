name: DNS check
on:
  push:
    branches: [old-site-archive]
    paths: [.github/workflows/dns-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          echo "== .com registry delegation"; dig +norec NS jaborholding.com @a.gtld-servers.net | sed -n '/AUTHORITY SECTION/,/^$/p'
          echo "== GoDaddy A"; dig +short A jaborholding.com @ns15.domaincontrol.com
          echo "== GoDaddy www"; dig +short CNAME www.jaborholding.com @ns15.domaincontrol.com
          echo "== public A"; dig +short A jaborholding.com @1.1.1.1; dig +short A jaborholding.com @8.8.8.8
          echo "== live page"; curl -s https://jaborholding.com/ | grep -oE '<title>[^<]*</title>|قريباً|رابطة رجال الأعمال|alarabi.png|qba.png' | sort | uniq -c
          echo "== en"; curl -s -o /dev/null -w "%{http_code}\n" https://jaborholding.com/en.html
          echo "== https cert"; curl -sv --resolve jaborholding.com:443:185.199.108.153 https://jaborholding.com/ -o /dev/null 2>&1 | grep -E "subject:|issuer:|SSL certificate verify|HTTP/|expire" | head -6
          echo "== http redirect"; curl -sI --resolve jaborholding.com:80:185.199.108.153 http://jaborholding.com/ | grep -iE "^HTTP|^location"
          echo "== www"; curl -sv --resolve www.jaborholding.com:443:185.199.108.153 https://www.jaborholding.com/ -o /dev/null 2>&1 | grep -E "subject:|issuer:|SSL certificate verify|HTTP/|location" | head -5
# Wed Oct 14 17:02:02 UTC 2026
