<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>جبر القابضة | Jabor Holding</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400&family=Cormorant+Garamond:wght@600&display=swap">
<style>
  :root{--maroon:#6B1230;--gold:#A88A45;--cream:#FAF5EF;--muted:#6E5F63;--line:#E5DACB}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--cream);color:var(--maroon);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  main{max-width:560px;width:100%}
  img{width:min(420px,90%);height:auto;margin:0 auto 40px;display:block}
  .rule{width:64px;height:1px;background:var(--gold);margin:0 auto 32px}
  h1{font-family:"Aref Ruqaa","Amiri",serif;font-weight:700;font-size:clamp(32px,7vw,44px);margin:0 0 8px;line-height:1.4}
  .en{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(22px,5vw,28px);color:var(--gold);margin:0 0 28px;letter-spacing:.02em}
  p{color:var(--muted);margin:0;font-size:15px;line-height:1.9}
</style>
</head>
<body>
<main>
  <img src="assets/logo.png" alt="جبر القابضة | Jabor Holding" width="1200" height="360">
  <div class="rule"></div>
  <h1>قريباً</h1>
  <div class="en" lang="en" dir="ltr">Coming soon</div>
  <p>الدوحة، قطر<br><span lang="en" dir="ltr">Doha, Qatar</span></p>
</main>
</body>
</html>
